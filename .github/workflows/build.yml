name: CI

on:
  push:
    branches: [ master, german-translation ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GAME_VERSION: FIRERED
      GAME_LANGUAGE: ENGLISH
      GAME_REVISION: 0
      MODERN: 0
      COMPARE: 0
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Pull LFS files
        run: |
          git lfs install
          git lfs pull

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          path: 'agbcc'
          repository: 'pret/agbcc'

      - name: Checkout symbols
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v4
        with:
          path: 'symbols'

      - name: Reset symbols branch to pret baseline
        if: ${{ github.event_name == 'push' }}
        working-directory: ./symbols
        run: |
          git remote add upstream https://github.com/pret/pokefirered.git
          git fetch upstream symbols || { echo "fetch upstream/symbols failed"; exit 1; }
          git checkout -B symbols upstream/symbols

      - name: Install binutils
        run: sudo apt install gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev
        # build-essential and git are already installed
        # gcc-arm-none-eabi is only needed for the modern build
        # as an alternative to dkP

      - name: Install agbcc
        run: |
          ./build.sh
          ./install.sh ../
        working-directory: ./agbcc

      - name: Fix permissions for all tools
        run: |
          find tools -type f \( -name '*.sh' -o -name '*.py' -o -perm -u+x \) -exec chmod +x {} \;

      - name: Build FireRed
        run: |
          make -j${nproc} all syms

      - name: Build FireRed rev1
        env:
          GAME_REVISION: 1
        run: |
          make -j${nproc} all syms

      - name: Build LeafGreen
        env:
          GAME_VERSION: LEAFGREEN
        run: |
          make -j${nproc} all syms

      - name: Build LeafGreen rev1
        env:
          GAME_VERSION: LEAFGREEN
          GAME_REVISION: 1
        run: |
          make -j${nproc} all syms

      - name: Build Modern
        continue-on-error: true
        env:
          MODERN: 1
          COMPARE: 0
        run: |
          make -j${nproc} all

      - name: Build German FireRed
        env:
          GAME_LANGUAGE: GERMAN
          COMPARE: 0
        run: |
          make -j$(nproc) all

      - name: Build German FireRed rev1
        env:
          GAME_LANGUAGE: GERMAN
          GAME_REVISION: 1
          COMPARE: 0
        run: |
          make -j$(nproc) all

      - name: Build German LeafGreen
        env:
          GAME_VERSION: LEAFGREEN
          GAME_LANGUAGE: GERMAN
          COMPARE: 0
        run: |
          make -j$(nproc) all

      - name: Build German LeafGreen rev1
        env:
          GAME_VERSION: LEAFGREEN
          GAME_LANGUAGE: GERMAN
          GAME_REVISION: 1
          COMPARE: 0
        run: |
          make -j$(nproc) all

      - name: Build German Modern
        continue-on-error: true
        env:
          GAME_LANGUAGE: GERMAN
          MODERN: 1
          COMPARE: 0
        run: |
          make -j$(nproc) all

      - name: Upload German ROM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: german-roms-${{ github.sha }}
          path: |
            pokefirered_de*.gba
            pokeleafgreen_de*.gba
          if-no-files-found: warn
          retention-days: 14

      - name: Move symfiles
        if: ${{ github.event_name == 'push' }}
        run: |
          shopt -s nullglob
          syms=(*.sym)
          if [ ${#syms[@]} -eq 0 ]; then
            echo "No .sym files produced; skipping symfile publish."
            echo "SYMBOLS_PUBLISH=false" >> "$GITHUB_ENV"
            exit 0
          fi
          cp "${syms[@]}" symbols/
          MSG="$(git log -1 --format=%s "${GITHUB_SHA}" || true)"
          echo "SYMBOLS_COMMIT_MSG=${MSG:-update symbols}" >> "$GITHUB_ENV"
          echo "SYMBOLS_PUBLISH=true" >> "$GITHUB_ENV"

      - name: Update symfiles
        if: ${{ github.event_name == 'push' && env.SYMBOLS_PUBLISH == 'true' }}
        uses: EndBug/add-and-commit@v7
        with:
          branch: symbols
          cwd: "./symbols"
          add: "*.sym"
          message: ${{ env.SYMBOLS_COMMIT_MSG }}
          push: --force origin symbols
